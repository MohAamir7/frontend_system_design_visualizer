<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>System Design Visualizer</h1>
        <!-- <button class="simulate-btn">Simulate</button> -->

    </header>
    
    <div class="app">
        <aside class="sidebar">
             <h3>Components</h3>
            <div class="node" data-type="client">Client</div>
            <div class="node" data-type="api">API Server</div>
            <div class="node" data-type="load-balancer">Load Balancer</div>
            <div class="node" data-type="cache">Cache</div>
            <div class="node" data-type="database">DataBase</div>
            <div class="node" data-type="message-queue">Message Queue</div>
        </aside>

        <div class="canvas-container">
            <button id="simulate-btn">Simulate</button>
            <main id="canvas">
                <svg id="connections">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth" >
                            <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
                        </marker>
                    </defs>
                </svg>
            </main>
        </div>
        <section class="config">
           <h3>Configuration</h3>

      <label for="latency">Latency (ms)</label>
      <input type="number" id="latency" placeholder="e.g. 50" />

      <label for="failure">Failure Rate (%)</label>
      <input type="number" id="failure" placeholder="e.g. 1" />

      <label for="throughput">Throughput</label>
      <input type="number" id="throughput" placeholder="Requests/sec" />
    </aside>

        </section>

    </div>
    

    </div>
</body>
<script type="module" src="/js/script.js"></script>
</html>
