<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>System Design Visualizer</h1>
        <span class="tagline">Drag, Connect, Simulate</span>
        <!-- <button class="simulate-btn">Simulate</button> -->

    </header>
    
    <div class="app">
        <aside class="sidebar">
             <h3>Components</h3>
            <div class="node" data-type="client">Client</div>
            <div class="node" data-type="api">API Server</div>
            <div class="node" data-type="load-balancer">Load Balancer</div>
            <div class="node" data-type="cache">Cache</div>
            <div class="node" data-type="database">DataBase</div>
            <div class="node" data-type="message-queue">Message Queue</div>


            <div class="legend">
        <h4>Node states</h4>
        <div class="legend-row">
          <span class="legend-swatch legend-active"></span>
          <span>Selected to connect</span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch legend-editing"></span>
          <span>Open in config panel</span>
        </div>
        </aside>

        <div class="canvas-container">
            <div class="toolbar">
                <button id="simulate-btn">Simulate</button>
                <button id="export-btn"  class="toolbar-btn">Export</button>
                <input type="file" id="import-input" accept="application/json" style="display: none;" />
                <button id="import-btn" class="toolbar-btn">Import</button>
                <button id="clear-btn" class="toolbar-btn toolbar-btn-danger">clear Diagram</button>
            </div>
            <main id="canvas">
                <div id="empty-hint" class="empty-hint">
          <p>Click a component on the left to place it here.</p>
          <p>Click two nodes in a row to connect them.</p>
        </div>
                <svg id="connections">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth" >
                            <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
                        </marker>
                    </defs>
                </svg>
            </main>
        </div>
        <section class="config">
           <h3>Configuration</h3>

      <label for="latency">Latency (ms)</label>
      <input type="number" id="latency" placeholder="e.g. 50" />

      <label for="failure">Failure Rate (%)</label>
      <input type="number" id="failure" placeholder="e.g. 1" />

      <label for="throughput">Throughput</label>
      <input type="number" id="throughput" placeholder="Requests/sec" />
      
      <label for="retries">Max Retries</label>
      <input type="number" id="retries" placeholder="e.g. 2" min="0" />
    </aside>
        <h3 class="metrics-heading">Live Metrics</h3>
        <div id="metrics-panel" class="metrics-panel"></div>


        </section>

    </div>
    

    </div>
    <script type="module" src="/js/script.js"></script>
</body>

</html>
